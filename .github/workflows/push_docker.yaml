name: push_docker
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      release_only:
        description: "仅补发 GitHub Release，不重新构建 Docker 镜像"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
env:
  IMAGE: qqzwqq/iptv
jobs:
  # 每个平台单独一个 job 并行构建，只按 digest 推送（不打标签），全部成功后由 merge 合成多架构清单再打标签。
  # arm64 放原生 arm runner：以前在 amd64 上走 QEMU 模拟时，arm64 的 npm ci 时常无输出卡死（历次取消重跑都卡在这一步）。
  # arm/v7、arm/v6 仍在 amd64 上走 QEMU：GitHub 的 arm64 机器不保证能原生跑 32 位，这两个平台也从没卡过。
  build:
    if: ${{ inputs.release_only != true }}
    name: build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64/v8
            runner: ubuntu-24.04-arm
          - platform: linux/arm/v7
            runner: ubuntu-latest
            qemu: true
          - platform: linux/arm/v6
            runner: ubuntu-latest
            qemu: true
    runs-on: ${{ matrix.runner }}
    # 单平台正常 1~3 分钟；卡住到点即失败，在 Actions 页点「Re-run failed jobs」只重跑失败的平台
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # 层缓存存在 Docker Hub 的 buildcache-<平台> 标签里（每个平台一份，互不覆盖；不像 GitHub 缓存 7 天不用就清）。
      # Dockerfile 把系统包排在 package.json 之前，发版时 Chromium、Python 这些大层直接复用缓存里的同一份，
      # 层的 digest 不变，用户升级只下 npm 依赖和代码两层。以前不配缓存，是因为当时 COPY package*.json 排在最前、
      # 版本号一变后面全部重建，缓存只命中 WORKDIR。
      # 缓存标签不带版本号，写成 env.IMAGE 而不是仓库名字面量：bump-version.js 按字面量改下面的版本标签
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }},mode=max
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true
  merge:
    if: ${{ inputs.release_only != true }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Create manifest list and push tags
        working-directory: ${{ runner.temp }}/digests
        # 下面的版本标签由 bump-version.js 改写（每种只改文件里第一处），保持一行一个
        env:
          TAGS: |
            qqzwqq/iptv:latest
            qqzwqq/iptv:4.81.0
            qqzwqq/iptv:4.81
            qqzwqq/iptv:4
        run: |
          docker buildx imagetools create \
            $(printf -- '-t %s ' $TAGS) \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:latest

  # 仅在多架构镜像全部推送成功后发布；也支持手动只补发 Release，不重建镜像。
  release:
    name: publish GitHub Release
    needs: [build, merge]
    if: ${{ always() && (inputs.release_only == true || needs.merge.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify versioned image exists
        run: |
          VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null
          echo "已确认 Docker Hub 镜像 ${IMAGE}:${VERSION}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          TAG="v${VERSION}"
          CHANGELOG_TAG=$(sed -nE 's/^### (v[0-9]+\.[0-9]+\.[0-9]+) \(.*/\1/p' CHANGELOG.md | head -n 1)
          if [ "${CHANGELOG_TAG}" != "${TAG}" ]; then
            echo "::error::package.json 版本 ${TAG} 与 CHANGELOG.md 最新条目 ${CHANGELOG_TAG:-缺失} 不一致"
            exit 1
          fi
          NOTES_FILE=$(mktemp)
          trap 'rm -f "${NOTES_FILE}"' EXIT
          node bump-version.js release-notes > "${NOTES_FILE}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，跳过，避免重复发布"
            exit 0
          fi
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file "${NOTES_FILE}" \
            --target "${GITHUB_SHA}"
          echo "已创建 GitHub Release: ${TAG}"
